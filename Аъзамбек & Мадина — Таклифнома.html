<title>Аъзамбек &amp; Мадина — Таклифнома</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&family=Playfair+Display:wght@400;600&display=swap">
<style>
:root{--black:#111015;--gold:#D4AF55;--ivory:#F3EBDD;--charcoal:#1B1920}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{background:var(--black);color:var(--ivory);font:300 16px/1.7 Montserrat,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}
header{position:fixed;top:env(safe-area-inset-top,0px);right:0;left:0;z-index:20;display:flex;justify-content:flex-end;gap:6px;padding:10px 14px}
header button,.fab{background:rgba(17,16,21,.8);color:var(--gold);border:1px solid var(--gold);border-radius:20px;font:500 12px Montserrat,sans-serif;letter-spacing:.1em;padding:6px 12px;cursor:pointer;transition:.3s}
header button.on,header button:hover,.fab:hover{background:var(--gold);color:var(--black)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
section{padding:72px 18px;max-width:1000px;margin:0 auto;text-align:center}
h2{font:600 clamp(1.8rem,6vw,2.8rem)/1.2 'Playfair Display',serif;color:var(--gold);margin-bottom:12px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:0 auto 28px;max-width:280px}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{transform:scaleX(-1)}
.orn i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.card{background:var(--charcoal);border:1px solid var(--gold);border-radius:18px;padding:26px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:620px;margin:0 auto}
.btn{display:inline-block;margin-top:16px;padding:12px 28px;border:1px solid var(--gold);border-radius:30px;color:var(--gold);background:transparent;font:500 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:.3s}
.btn:hover{background:var(--gold);color:var(--black)}
/* hero + opening */
#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding-top:70px}
.op{opacity:0;animation:in 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.glow{width:160px;height:160px;position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(212,175,85,.25),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.rings{width:84px;height:54px;position:relative}
.names{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,28px);flex-wrap:wrap;margin:10px 0}
.nm{font:600 clamp(2.4rem,10.5vw,5.2rem)/1.1 'Cormorant Garamond','Playfair Display',serif;letter-spacing:.04em;background:linear-gradient(180deg,var(--gold),var(--gold));-webkit-background-clip:text;background-clip:text;color:var(--gold);text-shadow:0 0 28px rgba(212,175,85,.25)}
.when{font:400 clamp(1rem,3.6vw,1.35rem) 'Playfair Display',serif;letter-spacing:.06em;margin-top:6px}
.where{opacity:.85;font-size:.95rem;margin-top:4px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--charcoal);border:1px solid var(--gold);border-radius:16px;padding:16px 10px;margin-top:28px;width:min(100%,430px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cd b{display:block;font:600 clamp(1.6rem,7vw,2.4rem)/1 'Playfair Display',serif;color:var(--gold)}
.cd span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
#cdDone{display:none;color:var(--gold);font:600 1.4rem 'Playfair Display',serif;grid-column:1/-1}
/* reveal */
.rv{opacity:0;transform:translateY(24px) scale(.98);transition:opacity .9s,transform .9s}
.rv.show{opacity:1;transform:none}
/* invitation */
.inv p{max-width:560px;margin:0 auto 26px;font-size:1.05rem}
.pair{display:flex;justify-content:center;gap:clamp(20px,8vw,80px);flex-wrap:wrap}
.pair b{display:block;font:600 1.6rem 'Cormorant Garamond',serif;color:var(--gold)}
.pair small{letter-spacing:.3em;font-size:.7rem;text-transform:uppercase}
/* marquee */
#gal{max-width:none;padding:30px 0 60px}
.mq{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:50px 0;-webkit-overflow-scrolling:touch}
.mq::-webkit-scrollbar{display:none}
.mq img{flex:0 0 clamp(150px,34vw,300px);height:clamp(200px,46vw,400px);object-fit:cover;border-radius:14px;border:1px solid var(--gold);margin:0 10px;transition:transform .15s linear,opacity .15s linear;will-change:transform}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin:0 auto}
.cal div{padding:8px 0;border-radius:8px;font-size:.95rem}
.cal .h{color:var(--gold);font-size:.75rem;letter-spacing:.08em}
.cal .x{background:transparent;color:var(--black);font-weight:700;font-size:.82rem;position:relative}
.cal .x:before{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#D4AF55;font-size:3rem;line-height:1;z-index:0}
.cal .x span{position:relative;z-index:1}
.mapbox{margin-top:20px;border-radius:14px;overflow:hidden;border:1px solid var(--gold);min-height:240px;display:flex;align-items:center;justify-content:center;padding:18px;font-size:.9rem;opacity:.95}
.mapbox iframe{width:100%;height:280px;border:0}
.info{margin:8px 0}
/* slideshow */
.ss{position:relative;aspect-ratio:16/10;max-width:620px;margin:0 auto 22px;border-radius:18px;overflow:hidden;border:1px solid var(--gold)}
.ss img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s;transform:scale(1)}
.ss img.on{opacity:1;animation:zoom 6s linear forwards}
@keyframes zoom{to{transform:scale(1.1)}}
/* choices */
.ch{display:grid;gap:12px;max-width:440px;margin:0 auto}
.ch button{background:var(--charcoal);color:var(--ivory);border:1px solid var(--gold);border-radius:14px;padding:14px;font:400 .82rem Montserrat,sans-serif;cursor:pointer;transition:.3s}
.ch button:hover,.ch button.sel{background:var(--gold);color:var(--black);transform:translateY(-2px)}
.msg{margin-top:14px;color:var(--gold);min-height:1.6em;font:400 .82rem 'Playfair Display',serif}
footer{text-align:center;padding:50px 18px calc(60px + env(safe-area-inset-bottom,0px))}
footer b{font:600 1.7rem 'Cormorant Garamond',serif;color:var(--gold)}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:46px;height:46px;border-radius:50%;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
#mus{left:14px}#top{right:14px;opacity:0;pointer-events:none}#top.v{opacity:1;pointer-events:auto}
#mus.play span{display:inline-block;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}html{scroll-behavior:auto}}
</style>
</head>

</main>
